name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dsh-code-pill-publish
  cancel-in-progress: false
jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Verify tag and runtime
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --version
          npm --version
          node -e 'const p=require("./package.json");if(process.env.RELEASE_TAG!=="v"+p.version)throw Error("tag/version mismatch")'
      - run: npm ci --ignore-scripts
      - run: node scripts/build.mjs && git diff --exit-code -- lib/client.js
      - run: node scripts/check-manifest.mjs && node scripts/check-docs.mjs && node --check lib/client.js
      - run: node tests/tokenizer.test.mjs && node tests/settings.test.mjs && node tests/fonts.test.mjs && node tests/font-catalog.test.mjs && node tests/client-smoke.test.mjs
      - run: node scripts/color-audit.mjs
      - run: node tests/browser-render.test.mjs && node tests/dynamic-render.test.mjs && node tests/settings-browser.test.mjs && node tests/tool-path.test.mjs && node tests/think-ink.test.mjs && node tests/row-tint.test.mjs
      - run: npm pack --ignore-scripts --json > pack.json && node scripts/prepare-release.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package
          path: dist/dsh-code-pill.tgz
          if-no-files-found: error
  npm:
    needs: verify
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-package
          path: dist
      - run: node --version && npm --version
      - run: node scripts/publish-npm.mjs
  github:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-package
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/dsh-code-pill.tgz
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
