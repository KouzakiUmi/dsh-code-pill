name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dsh-code-pill-publish
  cancel-in-progress: false
jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify tag and runtime
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --version
          npm --version
          node -e 'const p=require("./package.json");if(process.env.RELEASE_TAG!=="v"+p.version)throw Error("tag/version mismatch")'
      - run: npm ci --ignore-scripts
      - run: node scripts/build.mjs && git diff --exit-code -- lib/client.js
      - run: node scripts/check-manifest.mjs && node --check lib/client.js
      - run: node tests/tokenizer.test.mjs && node tests/client-smoke.test.mjs
      - run: node tests/browser-render.test.mjs
      - run: npm pack --ignore-scripts --json > pack.json && node scripts/prepare-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/dsh-code-pill.tgz
          if-no-files-found: error
  npm:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist
      - run: node --version && npm --version
      - run: node scripts/publish-npm.mjs
  github:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/dsh-code-pill.tgz
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
