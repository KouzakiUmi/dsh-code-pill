name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/build.mjs && git diff --exit-code -- lib/client.js
      - run: node scripts/check-manifest.mjs && node scripts/check-docs.mjs && node --check lib/client.js
      - run: node tests/tokenizer.test.mjs && node tests/settings.test.mjs && node tests/fonts.test.mjs && node tests/font-catalog.test.mjs && node tests/client-smoke.test.mjs
      - run: node scripts/color-audit.mjs
      - run: node tests/browser-render.test.mjs && node tests/dynamic-render.test.mjs && node tests/settings-browser.test.mjs && node tests/tool-path.test.mjs
      - run: npm pack --ignore-scripts --json > pack.json && node scripts/prepare-release.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-package
          path: dist/
          if-no-files-found: error
